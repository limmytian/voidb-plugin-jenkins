[capabilities.session_handoff.purpose]
kind = "watch_stream"

[capabilities.session_handoff.live_session]
protocol_version = 1
start_risk = "read_only"

[capabilities.session_handoff.live_session.kind]
kind = "wait"

[capabilities.session_handoff.live_session.resource]
resource_type = "jenkins_build"
identity_fields = [
    "/job_full_name",
    "/build_number",
]
audit_identity = "fingerprint"

[capabilities.session_handoff.live_session.resource.identity_schema]
additionalProperties = false
required = [
    "job_full_name",
    "build_number",
]
type = "object"

[capabilities.session_handoff.live_session.resource.identity_schema.properties.build_number]
minimum = 0
type = "integer"

[capabilities.session_handoff.live_session.resource.identity_schema.properties.job_full_name]
maxLength = 512
minLength = 1
type = "string"

[capabilities.session_handoff.live_session.start_parameters_schema]
additionalProperties = false
type = "object"

[capabilities.session_handoff.live_session.start_parameters_schema.properties.poll_interval_ms]
default = 1000
maximum = 10000
minimum = 250
type = "integer"

[capabilities.session_handoff.live_session.event_schema]
maxProperties = 16
type = "object"

[capabilities.session_handoff.live_session.operations]
events = "jenkins.build_wait"

[capabilities.session_handoff.live_session.buffer]
max_events = 32
max_bytes = 262144
overflow = "coalesce"

[capabilities.session_handoff.live_session.reconnect]
